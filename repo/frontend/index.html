<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .title {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .test-accounts {
            margin-top: 30px;
            padding: 20px;
            background: #f5f7fa;
            border-radius: 5px;
            font-size: 14px;
            color: #666;
        }

        .test-accounts h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .test-accounts p {
            margin: 5px 0;
        }

        .home-page {
            display: none;
            min-height: 100vh;
            background: #f5f7fa;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #667eea;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-btn {
            padding: 8px 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .content {
            padding: 40px;
        }

        .welcome-card {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .welcome-card h2 {
            color: #28a745;
            margin-bottom: 20px;
        }

        .test-result {
            margin-top: 20px;
            padding: 20px;
            background: #f5f7fa;
            border-radius: 5px;
            text-align: left;
        }

        .test-result pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }

        .test-btn {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container" id="loginPage">
        <h1 class="title">用户管理系统</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required placeholder="请输入密码">
            </div>
            <button type="submit" class="btn" id="loginBtn">登录</button>
        </form>
        <!-- <div class="message" id="message"></div>
        <div class="test-accounts">
            <<h3>测试账号：</h3>
            <p>admin / 123456 (管理员)</p>
            <p>zhangsan / 123456 (普通用户)</p>
            <p>wangwu / 123456 (已禁用)</p> 
        </div> -->
    </div>

    <div class="home-page" id="homePage">
        <div class="header">
            <h1>用户管理系统</h1>
            <div class="user-info">
                <span id="welcomeUser"></span>
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </div>
        <div class="content">
            <div class="welcome-card">
                <h2>✓ 登录成功</h2>
                <p>欢迎使用用户管理系统</p>
                <button class="test-btn" onclick="testApi()">测试后端 API</button>
                <div class="test-result" id="testResult" style="display: none;">
                    <h3>API 测试结果：</h3>
                    <pre id="testResultPre"></pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        
        // 检查登录状态
        window.onload = function() {
            const user = localStorage.getItem('user');
            if (user) {
                showHomePage(JSON.parse(user));
            }
        };

        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showHomePage(data.user);
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert('登录失败，请检查网络连接');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        });

        function showHomePage(user) {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('homePage').style.display = 'block';
            document.getElementById('welcomeUser').textContent = `欢迎，${user.username}`;
        }

        function logout() {
            localStorage.removeItem('user');
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        async function testApi() {
            const testResult = document.getElementById('testResult');
            const testResultPre = document.getElementById('testResultPre');
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: '123456',
                    }),
                });
                
                const data = await response.json();
                testResultPre.textContent = JSON.stringify(data, null, 2);
                testResult.style.display = 'block';
            } catch (error) {
                testResultPre.textContent = 'API 调用失败：' + error.message;
                testResult.style.display = 'block';
            }
        }
    </script>
</body>
</html>
